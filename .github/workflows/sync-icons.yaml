name: Sync icons
on:
  # Allow workflow to be run manually
  workflow_dispatch: {}
  schedule:
    # Run at least once per week
    - cron: '20 2 * * WED'
permissions: {}
env:
  svg2xml_version: 1.0.2
jobs:
  types:
    name: Sync icons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Setup svg2xml
        run: |
          ./.github/workflows/scripts/svg2xml.sh ${{ env.svg2xml_version }}
          echo "$PWD/svg2xml-${{ env.svg2xml_version }}/bin" >> $GITHUB_PATH
      - name: Sync icons
        run: pnpm sync:icons
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
      - name: Generate files
        run: pnpm build
      - name: Clean up
        run: rm -r svg2xml*
      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # CI won't run if we use the default GITHUB_TOKEN
          token: ${{ secrets.ELEMENT_BOT_TOKEN }}
          commit-message: Sync icons from Figma
          title: Sync icons from Figma
          body: New data is available from [Compound Icons](https://www.figma.com/design/gkNXqPoiJhEv2wt0EJpew4/Compound-Icons).
          branch: actions/sync-tokens
          delete-branch: true
